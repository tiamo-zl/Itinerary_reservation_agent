[alembic]
script_location = src/itinerary_agent/infra/migrations
prepend_sys_path = src
# 运行时由 env.py 用 DATABASE_URL 覆盖；这里只是本地默认值。
sqlalchemy.url = postgresql+psycopg://itinerary:itinerary_dev@127.0.0.1:55432/itinerary
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
