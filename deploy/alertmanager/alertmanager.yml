# 本地演示配置：Prometheus -> Alertmanager -> Mailpit。
#
# 生产环境只需要改这里，不需要改 Prometheus 规则：
#   smtp_smarthost、smtp_from、smtp_auth_*、smtp_require_tls
#   email_configs.to
#
# 以后接企业微信/钉钉时，把对应 receiver 的 email_configs 换成
# webhook_configs（或增加一个 relay），路由和严重级别不需要动。

global:
  resolve_timeout: 5m

  # 163 邮箱：
  #   - smtp.163.com:25 支持 STARTTLS（Alertmanager 使用 smtp_require_tls）
  #   - 465 是隐式 TLS，Alertmanager 不支持；如必须用 465，需要本地 relay
  #   - 密码必须是 163 的 SMTP 授权码，不是登录密码
  smtp_smarthost: 'smtp.163.com:25'
  smtp_from: 'your-account@163.com'
  smtp_hello: 'itinerary.local'
  smtp_auth_username: 'your-account@163.com'
  smtp_auth_password_file: '/etc/alertmanager/secrets/smtp_password'
  smtp_require_tls: true

  # 本地 Mailpit 回退配置见 alertmanager.mailpit.yml

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'email-warning'
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Watchdog 用于验证整条告警链路；每天一封，收不到就说明链路坏了。
    - matchers:
        - 'alertname="Watchdog"'
      receiver: 'email-watchdog'
      repeat_interval: 24h

    - matchers:
        - 'severity="critical"'
      receiver: 'email-critical'
      repeat_interval: 1h

    - matchers:
        - 'severity="warning"'
      receiver: 'email-warning'
      repeat_interval: 4h

    - matchers:
        - 'severity="info"'
      receiver: 'email-info'
      repeat_interval: 24h

inhibit_rules:
  # 服务抓取失败时，抑制该服务的其它告警，避免一次故障刷屏。
  - source_matchers:
      - 'alertname="ItineraryServiceDown"'
    target_matchers:
      - 'severity=~"critical|warning|info"'
      - 'alertname!="ItineraryServiceDown"'
      - 'alertname!="Watchdog"'
    equal: ['service']

  # 快速燃烧已经 page 时，抑制同一 SLO 的慢速燃烧邮件。
  - source_matchers:
      - 'alertname="ItinerarySLOBurnFast"'
    target_matchers:
      - 'alertname="ItinerarySLOBurnSlow"'
    equal: ['service', 'slo']

receivers:
  - name: 'email-critical'
    email_configs:
      - to: 'your-account@163.com'
        send_resolved: true
        headers:
          subject: '{{ template "itinerary.email.subject" . }}'
        html: '{{ template "itinerary.email.html" . }}'
        text: '{{ template "itinerary.email.text" . }}'

  - name: 'email-warning'
    email_configs:
      - to: 'your-account@163.com'
        send_resolved: true
        headers:
          subject: '{{ template "itinerary.email.subject" . }}'
        html: '{{ template "itinerary.email.html" . }}'
        text: '{{ template "itinerary.email.text" . }}'

  - name: 'email-info'
    email_configs:
      - to: 'your-account@163.com'
        send_resolved: true
        headers:
          subject: '{{ template "itinerary.email.subject" . }}'
        html: '{{ template "itinerary.email.html" . }}'
        text: '{{ template "itinerary.email.text" . }}'

  - name: 'email-watchdog'
    email_configs:
      - to: 'your-account@163.com'
        send_resolved: true
        headers:
          subject: '{{ template "itinerary.email.subject" . }}'
        html: '{{ template "itinerary.email.html" . }}'
        text: '{{ template "itinerary.email.text" . }}'
