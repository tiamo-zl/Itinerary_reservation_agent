server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

live_store:
  max_block_duration: 5m
  wal:
    path: /var/tempo/wal

backend_worker:
  compaction:
    # 30 天保留；本地磁盘，适合单机验证。
    block_retention: 720h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
