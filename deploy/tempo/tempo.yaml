server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

live_store:
  max_block_duration: 5m
  wal:
    path: /var/tempo/wal

backend_worker:
  compaction:
    # 30 天保留；本地磁盘，适合单机验证。
    block_retention: 720h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

# 从 trace 生成 Service Graph / span metrics，写入现有 Prometheus。
# Grafana 的 Tempo Service Graph 查询依赖这些指标。
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs: {}
    span_metrics: {}

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
