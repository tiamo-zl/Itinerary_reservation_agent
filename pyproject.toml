[project]
name = "itinerary-reservation-agent"
version = "0.1.0"
description = "Production-like corporate travel reservation agent demo"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20.1",
  "fastapi>=0.115",
  "httpx>=0.28.1",
  "jsonschema>=4.23",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=3.2.0",
  "openai>=1.40",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
  "opentelemetry-instrumentation-psycopg>=0.66b2",
  "opentelemetry-instrumentation-redis>=0.66b2",
  "opentelemetry-sdk>=1.45.2",
  "prometheus-client>=0.26.0",
  "psycopg[binary,pool]>=3.3.6",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.15.1",
  "pymilvus>=2.4,<3.0",
  "pymupdf>=1.24,<2.0",
  "python-json-logger>=4.2.0",
  "pyyaml>=6.0",
  "redis>=8.1.0",
  "sqlalchemy>=2.1.6",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "fakeredis>=2.40.0",
  "httpx>=0.27",
  "mypy>=2.4.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true

[tool.coverage.run]
source = ["src/itinerary_agent"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 70
