[project]
name = "itinerary-reservation-agent"
version = "0.1.0"
description = "Production-like corporate travel reservation agent demo"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "jsonschema>=4.23",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "openai>=1.40",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pymilvus>=2.4,<3.0",
  "pymupdf>=1.24,<2.0",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
