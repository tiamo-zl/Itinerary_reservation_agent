server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 容器重建后 API 的 IP 会变化；用 Docker DNS 在请求时解析，
    # 避免 Nginx 启动时缓存旧地址导致 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # SPA 路由回退。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 与 SSE；关闭缓冲，避免事件流被 Nginx 攒住。
    location ~ ^/(chat|tasks|sessions|conversations|traces|approvals|admin|feedback|badcases|health|healthz|readyz|metrics) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
