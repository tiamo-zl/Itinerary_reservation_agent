# 本地生产化基础设施与核心服务。
#
# 端口刻意避开宿主机上已有的 Langfuse 栈：
#   Postgres 5432 -> 55432
#   Redis    6379 -> 56379
#
# 用法：
#   docker compose --profile core up -d --build
#   docker compose --profile core down

name: itinerary-reservation-agent

x-app-env: &app-env
  ENVIRONMENT: local
  DATABASE_URL: postgresql://itinerary:itinerary_dev@postgres:5432/itinerary
  REDIS_URL: redis://redis:6379/0
  MODEL_MODE: scripted
  ADAPTER_MODE: ${ADAPTER_MODE:-mock}
  MOCK_DEPS_URL: ${MOCK_DEPS_URL:-http://mock-deps:9003}
  UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-5}
  UPSTREAM_MAX_RETRIES: ${UPSTREAM_MAX_RETRIES:-2}
  AUTH_MODE: ${AUTH_MODE:-mock}
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_ISSUER: ${JWT_ISSUER:-itinerary-agent-local}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-itinerary-agent}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-30}
  RATE_LIMIT_APPROVAL_PER_MINUTE: ${RATE_LIMIT_APPROVAL_PER_MINUTE:-60}
  RATE_LIMIT_FEEDBACK_PER_MINUTE: ${RATE_LIMIT_FEEDBACK_PER_MINUTE:-20}
  BUSINESS_METRICS_ENABLED: ${BUSINESS_METRICS_ENABLED:-true}
  BUSINESS_METRICS_INTERVAL_SECONDS: ${BUSINESS_METRICS_INTERVAL_SECONDS:-15}
  QUALITY_EVAL_ENABLED: ${QUALITY_EVAL_ENABLED:-true}
  QUALITY_EVAL_INTERVAL_SECONDS: ${QUALITY_EVAL_INTERVAL_SECONDS:-60}
  QUALITY_SAMPLE_RATE: ${QUALITY_SAMPLE_RATE:-0.05}
  QUALITY_LOOKBACK_MINUTES: ${QUALITY_LOOKBACK_MINUTES:-60}
  QUALITY_MAX_TASKS: ${QUALITY_MAX_TASKS:-100}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}

services:
  postgres:
    image: postgres:17
    profiles: ["core"]
    environment:
      POSTGRES_USER: itinerary
      POSTGRES_PASSWORD: itinerary_dev
      POSTGRES_DB: itinerary
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时额外创建测试库 itinerary_test。
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itinerary -d itinerary"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    profiles: ["core"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: itinerary-reservation-agent:local
    profiles: ["core"]
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: itinerary-reservation-agent:local
    profiles: ["core"]
    environment: *app-env
    # Higress 用 DNS registry 解析这个带点的别名；单标签 api 在 Envoy
    # 的 DNS 解析器里不可靠。
    networks:
      default:
        aliases:
          - api.local
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  worker:
    image: itinerary-reservation-agent:local
    profiles: ["core"]
    command:
      ["uvicorn", "--app-dir", "src", "itinerary_agent.workers.main:app",
       "--host", "0.0.0.0", "--port", "8001"]
    environment: *app-env
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  mock-deps:
    image: itinerary-reservation-agent:local
    profiles: ["mocks"]
    command:
      ["uvicorn", "--app-dir", "src",
       "itinerary_agent.mock_services.deps:app",
       "--host", "0.0.0.0", "--port", "9003"]
    environment: *app-env
    ports:
      - "127.0.0.1:9003:9003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9003/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["chaos"]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:19003:19003"

  mock-idp:
    image: itinerary-reservation-agent:local
    profiles: ["mocks"]
    command:
      ["uvicorn", "--app-dir", "src",
       "itinerary_agent.mock_services.identity:app",
       "--host", "0.0.0.0", "--port", "9002"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-itinerary-agent-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-itinerary-agent}
    ports:
      - "127.0.0.1:9002:9002"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      LANGFUSE_AUTH: ${LANGFUSE_AUTH:-}
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - default
      - langfuse-stack_default
      - monitoring-stack_monitoring
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    profiles: ["core"]
    networks:
      default:
        aliases:
          - web.local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  langfuse-stack_default:
    external: true
  monitoring-stack_monitoring:
    external: true

volumes:
  pgdata:
  redisdata:
